name: Installer smoke test

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install latest release on Linux
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Run the public installer
        run: |
          install_dir=$(mktemp -d)
          trap 'rm -rf "$install_dir"' EXIT
          curl -fsSL \
            https://github.com/Makuraryu/Noren/releases/latest/download/install.sh \
            | env NOREN_INSTALL_DIR="$install_dir" sh
          "$install_dir/noren" version | grep -E '^noren [0-9]+\.[0-9]+\.[0-9]+ '
